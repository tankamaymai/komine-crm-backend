    put:
      tags:
        - Staff
      summary: スタッフ情報更新
      description: |
        スタッフ情報を更新します。
        - 名前、メールアドレス、役割の更新
        - Supabase側のメールアドレス更新も同期
        - 管理者権限（admin）のみアクセス可能
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: スタッフID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/StaffAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
