                        format: uri
                        description: ファイル配信エンドポイントの相対URL（要Bearer認証）
                        example: /api/v1/documents/123e4567-e89b-42d3-a456-426614174000/file
                      fileName:
                        type: string
                        example: invoice_2024.pdf
                      mimeType:
                        type: string
                        example: application/pdf
                      expiresIn:
                        type: integer
                        description: 有効期限（秒）。0は無期限（認証付きエンドポイントのため）
                        example: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/documents/{id}/file:
    get:
      tags:
        - Documents
      summary: ファイル本体ダウンロード
      description: アップロードされたファイル本体をローカルストレージ（UPLOAD_DIR）から配信
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 書類ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: ファイルダウンロード
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/masters/section-name:
    get:
      tags:
        - Masters
      summary: 区画名マスタ一覧取得
      description: 有効な区画名マスタデータを表示順で取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 区画名マスタ一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SectionNameMaster"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/masters/relationship:
    get:
      tags:
        - Masters
      summary: 続柄マスタ一覧取得
      description: 有効な続柄マスタデータを表示順で取得（レガシー sykbnn KBNNO=2009 由来）
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 続柄マスタ一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RelationshipMaster"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/masters/contractor:
    get:
      tags:
        - Masters
      summary: 工事業者マスタ一覧取得
      description: 有効な工事業者マスタデータを表示順で取得（ConstructionInfo.contractor の select 候補）
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 工事業者マスタ一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContractorMaster"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/masters/direction:
    get:
      tags:
        - Masters
      summary: 方角マスタ一覧取得
      description: 有効な方角マスタデータを表示順で取得（レガシー sykbnn KBNNO=2024 由来）。code は GravestoneInfo.direction_id の int 文字列。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 方角マスタ一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DirectionMaster"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/masters/position:
    get:
      tags:
        - Masters
      summary: 位置マスタ一覧取得
      description: 有効な位置マスタデータを表示順で取得（レガシー sykbnn KBNNO=2025 由来）。code は GravestoneInfo.position_id の int 文字列。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 位置マスタ一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PositionMaster"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/masters/validity-period:
    get:
      tags:
        - Masters
      summary: 合祀年数マスタ一覧取得
      description: 合祀までの年数（13/15/24/33）の選択肢を表示順で取得（#343, komine-docs#10 Q17）。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 合祀年数マスタ一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MasterItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/masters/change-reason:
    get:
      tags:
        - Masters
      summary: 変更理由マスタ一覧取得
      description: 変更履歴の理由（名義変更/住所変更/解約/合祀 等）の選択肢を表示順で取得（#344, komine-docs#10 項目4）。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 変更理由マスタ一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MasterItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/masters/all:
    get:
      tags:
        - Masters
      summary: 全マスタデータ一括取得
      description: 全マスタテーブルのデータを一括取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 全マスタデータ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      sectionName:
                        type: array
                        items:
                          $ref: "#/components/schemas/SectionNameMaster"
                      relationship:
                        type: array
                        items:
                          $ref: "#/components/schemas/RelationshipMaster"
                      contractor:
                        type: array
                        items:
                          $ref: "#/components/schemas/ContractorMaster"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/yucho/billing:
    get:
      tags:
        - Yucho
      summary: ゆうちょ請求対象データ取得
      description: |
        指定期間の管理料・合祀料金の請求対象データを集約して返す。
        各レコードには契約区画情報、顧客情報、口座情報、請求金額が含まれる。
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 1900
            maximum: 2999
          description: 対象年（西暦）
        - name: month
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: 対象月。指定なしの場合は年単位で集計
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [ management, collective, all ]
            default: all
          description: 請求対象カテゴリ
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ unbilled, billed, paid, all ]
            default: unbilled
          description: 請求ステータスフィルタ
      responses:
        "200":
          description: 請求対象データ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      period:
                        type: object
                        properties:
                          year:
                            type: integer
                          month:
                            type: integer
                            nullable: true
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            category:
                              type: string
                              enum: [ management, collective ]
                            sourceId:
                              type: string
                            contractPlotId:
                              type: string
                            plotNumber:
                              type: string
                            areaName:
                              type: string
                            customerId:
                              type: string
                              nullable: true
                            customerName:
                              type: string
                              nullable: true
                            customerNameKana:
                              type: string
                              nullable: true
                            billingAmount:
                              type: integer
                            billingStatus:
                              type: string
                            scheduledDate:
                              type: string
                              nullable: true
                            billingMonth:
                              type: integer
                              nullable: true
                            billingInfo:
                              type: object
                              nullable: true
                              properties:
                                bankName:
                                  type: string
                                  nullable: true
                                branchName:
                                  type: string
                                  nullable: true
                                accountType:
                                  type: string
                                  nullable: true
                                accountNumber:
                                  type: string
                                  nullable: true
                                accountHolder:
                                  type: string
                                  nullable: true
                      summary:
                        type: object
                        properties:
                          totalCount:
                            type: integer
                          totalAmount:
                            type: integer
                          byCategory:
                            type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/yucho/export:
    get:
      tags:
        - Yucho
      summary: ゆうちょ自動払込み用CSV出力
      description: |
        全銀協フォーマット（120バイト固定長レコード）のCSVを生成して返す。
        ヘッダー(1) + データ(2) + トレーラー(8) + エンド(9) の構成。
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: false
          schema:
            type: integer
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [ management, collective, all ]
            default: all
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ unbilled, billed, paid, all ]
            default: unbilled
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [ zengin ]
            default: zengin
        - name: transferDate
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: 引落日 (YYYY-MM-DD)
        - name: clientCode
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{1,10}$"
          description: 委託者コード（最大10桁）
        - name: clientName
          in: query
          required: true
          schema:
            type: string
            maxLength: 40
          description: 委託者名（半角40文字以内）
        - name: bankCode
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{4}$"
            default: "9900"
          description: 取引銀行コード（4桁、デフォルト 9900 = ゆうちょ）
        - name: branchCode
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{3}$"
            default: "000"
          description: 取引支店コード（3桁）
      responses:
        "200":
          description: 全銀協フォーマット CSV
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabaseから発行されたJWTトークンを使用

  schemas:
    # ==================== Master スキーマ ====================

    SectionNameMaster:
      type: object
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: "1-A"
        name:
          type: string
          example: "A"
        period:
          type: string
          example: "第1期"
        description:
          type: string
          nullable: true
        sortOrder:
          type: integer
          nullable: true
          example: 1
        isActive:
          type: boolean
          example: true

    RelationshipMaster:
      type: object
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: "spouse"
        name:
          type: string
          example: "配偶者"
        description:
          type: string
          nullable: true
        sortOrder:
          type: integer
          nullable: true
          example: 1
        isActive:
          type: boolean
          example: true

    ContractorMaster:
      type: object
      description: 工事業者マスタ (ConstructionInfo.contractor の select 候補)
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: "placeholder-1"
        name:
          type: string
          example: "小嶺石材"
        description:
          type: string
          nullable: true
        sortOrder:
          type: integer
          nullable: true
          example: 1
        isActive:
          type: boolean
          example: true

    DirectionMaster:
      type: object
      description: 方角マスタ。code は GravestoneInfo.direction_id (レガシー houi_id) の int 文字列。
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: "1"
        name:
          type: string
          example: "東"
        description:
          type: string
          nullable: true
        sortOrder:
          type: integer
          nullable: true
          example: 1
        isActive:
          type: boolean
          example: true

    PositionMaster:
      type: object
      description: 位置マスタ。code は GravestoneInfo.position_id (レガシー ichi_id) の int 文字列。
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: "1"
        name:
          type: string
          example: "角"
        description:
          type: string
          nullable: true
        sortOrder:
          type: integer
          nullable: true
          example: 1
        isActive:
          type: boolean
          example: true

    MasterItem:
      type: object
      description: 標準マスタ項目（合祀年数・変更理由 等の共通形）。
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: "13"
        name:
          type: string
          example: "13年"
        description:
          type: string
          nullable: true
        sortOrder:
          type: integer
          nullable: true
          example: 13
        isActive:
          type: boolean
          example: true

    # ==================== Document スキーマ ====================

    DocumentType:
      type: string
      description: 書類タイプ
      enum:
        - invoice
        - postcard
        - contract
        - permit
        - envelope_letter
        - envelope_base
        - other
      example: invoice

    DocumentStatus:
      type: string
      description: 書類ステータス
      enum:
        - draft
        - generated
        - sent
        - archived
      example: draft

    DocumentListItem:
      type: object
      description: 書類一覧アイテム
      properties:
        id:
          type: string
          format: uuid
          description: 書類ID
        contractPlotId:
          type: string
          format: uuid
          nullable: true
          description: 契約区画ID
        customerId:
          type: string
          format: uuid
          nullable: true
          description: 顧客ID
        type:
          $ref: "#/components/schemas/DocumentType"
        name:
          type: string
          description: 書類名
          example: 請求書_2024年1月分
        description:
          type: string
          nullable: true
          description: 説明
        status:
          $ref: "#/components/schemas/DocumentStatus"
        fileName:
          type: string
          nullable: true
          description: ファイル名
          example: invoice_2024_01.pdf
        fileSize:
          type: integer
          nullable: true
          description: ファイルサイズ（バイト）
          example: 102400
        mimeType:
          type: string
          nullable: true
          description: MIMEタイプ
          example: application/pdf
        templateType:
          type: string
          nullable: true
          description: テンプレートタイプ
        generatedAt:
          type: string
          format: date-time
          nullable: true
          description: 生成日時
        sentAt:
          type: string
          format: date-time
          nullable: true
          description: 送付日時
        createdBy:
          type: string
          nullable: true
          description: 作成者
        notes:
          type: string
          nullable: true
          description: 備考
        createdAt:
          type: string
          format: date-time
          description: 作成日時
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
        contractPlot:
          type: object
          nullable: true
          description: 関連区画情報
          properties:
            id:
              type: string
              format: uuid
            plotNumber:
              type: string
            areaName:
              type: string
        customer:
          type: object
          nullable: true
          description: 関連顧客情報
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            nameKana:
              type: string

    DocumentDetail:
      type: object
      description: 書類詳細
      allOf:
        - $ref: "#/components/schemas/DocumentListItem"
        - type: object
          properties:
            fileKey:
              type: string
              nullable: true
              description: ファイルキー（S3/ローカル）
            templateData:
              type: object
              nullable: true
              description: テンプレートデータ（JSON）
            contractPlot:
              type: object
              nullable: true
              description: 関連区画詳細
              properties:
                id:
                  type: string
                  format: uuid
                contractAreaSqm:
                  type: number
                contractDate:
                  type: string
                  format: date
                  nullable: true
                physicalPlot:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    plotNumber:
                      type: string
                    areaName:
                      type: string
            customer:
              type: object
              nullable: true
              description: 関連顧客詳細
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                nameKana:
                  type: string
                postalCode:
                  type: string
                address:
                  type: string
                phoneNumber:
                  type: string
                  nullable: true
                email:
                  type: string
                  nullable: true

    CreateDocumentRequest:
      type: object
      description: 書類作成リクエスト
      required:
        - type
        - name
      properties:
        contractPlotId:
          type: string
          format: uuid
          description: 契約区画ID
        customerId:
          type: string
          format: uuid
          description: 顧客ID
        type:
          $ref: "#/components/schemas/DocumentType"
        name:
          type: string
          description: 書類名
          maxLength: 200
          example: 請求書_2024年1月分
        description:
          type: string
          description: 説明
        templateType:
          type: string
          description: テンプレートタイプ（invoice, postcard）
        templateData:
          type: object
          description: テンプレートデータ
        notes:
          type: string
          description: 備考

    UpdateDocumentRequest:
      type: object
      description: 書類更新リクエスト
      properties:
        name:
          type: string
          description: 書類名
          maxLength: 200
        description:
          type: string
          description: 説明
        status:
          $ref: "#/components/schemas/DocumentStatus"
        templateData:
          type: object
          description: テンプレートデータ
        notes:
          type: string
          description: 備考

    GeneratePdfRequest:
      type: object
      description: PDF生成リクエスト
      required:
        - templateType
        - templateData
      properties:
        templateType:
          type: string
          enum:
            - invoice
            - postcard
            - permit
            - envelope-letter
            - envelope-base
            - payment-guide
          description: テンプレートタイプ
        templateData:
          type: object
          description: テンプレートデータ（請求書またははがき用）
        documentId:
          type: string
          format: uuid
          description: 関連する書類ID（指定時はファイルを保存）
        name:
          type: string
          description: 書類名
        contractPlotId:
          type: string
          format: uuid
          description: 契約区画ID
        customerId:
          type: string
          format: uuid
          description: 顧客ID

    GeneratePdfResponse:
      type: object
      description: PDF生成レスポンス
      properties:
        documentId:
          type: string
          format: uuid
          description: 書類ID
        pdf:
          type: string
          description: Base64エンコードされたPDF
        mimeType:
          type: string
          example: application/pdf
        fileSize:
          type: integer
          description: ファイルサイズ（バイト）
          example: 102400

    # ==================== Staff スキーマ ====================

    Staff:
      type: object
      description: スタッフ情報（内部処理・DB操作用、APIレスポンスでは使用しない）
      properties:
        id:
          type: integer
          description: スタッフID
          example: 1
        supabase_uid:
          type: string
          description: Supabase User ID（内部管理用）
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          description: スタッフ名
          example: 山田太郎
          maxLength: 100
        email:
          type: string
          format: email
          description: メールアドレス
          example: yamada@example.com
          maxLength: 254
        role:
          type: string
          description: 役割
          enum: [ viewer, operator, manager, admin ]
          example: operator
        is_active:
          type: boolean
          description: アクティブ状態
          example: true
        last_login_at:
          type: string
          format: date-time
          description: 最終ログイン日時
          nullable: true
          example: "2024-01-01T12:00:00Z"
        created_at:
          type: string
          format: date-time
          description: 作成日時
          example: "2024-01-01T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: 更新日時
          example: "2024-01-01T12:00:00Z"

    StaffPublic:
      type: object
      description: スタッフ情報（一般公開用・認証レスポンス用）
      properties:
        id:
          type: integer
          description: スタッフID
          example: 1
