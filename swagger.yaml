openapi: 3.0.3
info:
  title: Cemetery CRM API
  description: 墓石管理システム（Cemetery Management System）のバックエンドAPI
  version: 1.0.0
  contact:
    name: Cemetery CRM Support

servers:
  - url: http://localhost:4000
    description: ローカル開発環境
  - url: http://localhost:4000/api/v1
    description: API v1 ベースURL

tags:
  - name: Auth
    description: 認証関連のエンドポイント
  - name: Plots
    description: 区画（墓石）管理
  - name: Masters
    description: マスターデータ
  - name: Staff
    description: スタッフ管理
  - name: Documents
    description: 書類管理（PDF生成・ファイルアップロード）
  - name: Yucho
    description: ゆうちょ連携（自動払込み用CSV生成）
  - name: Customers
    description: 顧客（解約者参照）

paths:
  /api/v1/customers/terminated:
    get:
      tags:
        - Customers
      summary: 解約者一覧・検索
      description: |
        解約者（is_terminated=true 顧客、レガシー del_flg=2 由来 #129）を一覧・検索する（#311）。
        解約者は契約・請求・入金にリンクされない独立した顧客レコードのため、
        台帳問い合わせ（/plots）には現れず、本エンドポイントが唯一の参照経路。
        notes には旧区画手がかり（旧区画cd: X / 区画No: legacy-X）が記録済み。
        解約者に紐づく家族連絡先（contract_plot_id=null、customer 直リンク）も併せて返す。
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: string
            default: "1"
        - name: limit
          in: query
          schema:
            type: string
            default: "20"
        - name: search
          in: query
          description: 氏名・カナ・電話番号・備考（旧区画手がかり）・旧檀家コードの部分一致検索
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: 解約者一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                            nameKana:
                              type: string
                              nullable: true
                            postalCode:
                              type: string
                              nullable: true
                            address:
                              type: string
                              nullable: true
                            phoneNumber:
                              type: string
                              nullable: true
                            email:
                              type: string
                              nullable: true
                            notes:
                              type: string
                              nullable: true
                              description: 旧区画手がかり（旧区画cd / 区画No legacy-X）を含む
                            legacyDankaCd:
                              type: integer
                              nullable: true
                            createdAt:
                              type: string
                              format: date-time
                            familyContacts:
                              type: array
                              description: 解約者に紐づく家族連絡先（区画リンクなし #311）
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                  name:
                                    type: string
                                  nameKana:
                                    type: string
                                    nullable: true
                                  relationship:
                                    type: string
                                  phoneNumber:
                                    type: string
                                    nullable: true
                                  address:
                                    type: string
                                    nullable: true
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          totalPages:
                            type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: ログイン
      description: メールアドレスとパスワードでログインし、JWTトークンを取得
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        "200":
          description: ログイン成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/StaffPublic"
                      session:
                        type: object
                        properties:
                          access_token:
                            type: string
                          refresh_token:
                            type: string
                          expires_at:
                            type: integer
                            description: トークンの有効期限（UNIXタイムスタンプ）
                            example: 1704067200
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/plots:
    get:
      tags:
        - Plots
      summary: 契約区画一覧取得
      description: 契約区画の一覧を取得（検索・ページネーション対応）。物理区画と契約情報を含む。
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: ページ番号（1から開始）
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: 1ページあたりの件数
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          description: 検索キーワード（区画番号、顧客名で検索）
          schema:
            type: string
        - name: usageStatus
          in: query
          description: 使用状況フィルタ
          schema:
            type: string
        - name: cemeteryType
          in: query
          description: 墓地タイプフィルタ
          schema:
            type: string
        - name: graveKind
          in: query
          description: 区画区分フィルタ（grave_kind、レガシー tinyint 値）
          schema:
            type: integer
        - name: graveKubun
          in: query
          description: 区画区分フィルタ（grave_kubun、レガシー tinyint 値）
          schema:
            type: integer
        - name: graveType
          in: query
          description: 区画区分フィルタ（grave_type、レガシー tinyint 値）
          schema:
            type: integer
        - name: contractStatus
          in: query
          description: 契約ステータスフィルタ（台帳問い合わせはvacant非表示のためactive/terminatedのみ指定可）
          schema:
            type: string
            enum: [active, terminated]
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContractPlotSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Plots
      summary: 新規契約区画作成
      description: 物理区画と契約区画を同時に作成。顧客情報、販売契約、オプション情報も含む。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlotInput"
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: 作成されたContractPlotのID
                      message:
                        type: string
                        example: 契約区画を作成しました
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/plots/grave-classifications:
    get:
      tags:
        - Plots
      summary: 区画区分 distinct 値取得
      description: |
        ContractPlot に存在する grave_kind / grave_kubun / grave_type の
        一意な値の一覧を返します。区画一覧画面のフィルタ select 用。
        master 化されるまでの暫定エンドポイントです。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      graveKinds:
                        type: array
                        items:
                          type: integer
                      graveKubuns:
                        type: array
                        items:
                          type: integer
                      graveTypes:
                        type: array
                        items:
                          type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/plots/{id}:
    get:
      tags:
        - Plots
      summary: 契約区画詳細取得
      description: 指定した契約区画の詳細情報を取得。物理区画、顧客、販売契約、オプション情報を含む。includeHistory=true
        を指定すると変更履歴（histories）も同梱して返す。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 契約区画ID（UUID）
          schema:
            type: string
            format: uuid
        - name: includeHistory
          in: query
          required: false
          description: true を指定するとレスポンスの data.histories に変更履歴を同梱する。
          schema:
            type: boolean
            default: false
        - name: historyLimit
          in: query
          required: false
          description: includeHistory=true のときに同梱する履歴の最大件数。
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    allOf:
                      - $ref: "#/components/schemas/ContractPlotDetail"
                      - type: object
                        properties:
                          histories:
                            type: array
                            description: includeHistory=true のときのみ返却される変更履歴。
                            items:
                              $ref: "#/components/schemas/History"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Plots
      summary: 契約区画更新
      description: 契約区画情報を更新。部分更新をサポート（contractPlot, saleContract, customer, workInfo,
        billingInfo, usageFee, managementFee）。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 契約区画ID（UUID）
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlotInput"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      message:
                        type: string
                        example: 契約区画を更新しました
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Plots
      summary: 契約区画削除（論理削除）
      description: 契約区画を論理削除。関連する販売契約、使用料、管理料、請求情報、勤務先情報も削除。顧客は他の契約がない場合のみ削除。物理区画のステータスは自動更新。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 契約区画ID（UUID）
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 削除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 契約区画を削除しました
                      id:
                        type: string
                        format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/plots/{id}/history:
    get:
      tags:
        - Plots
      summary: 契約区画の変更履歴取得
      description: 指定した契約区画に関連する変更履歴をページネーション付きで取得。物理区画自体の履歴は当該物理区画分のみ含み、他契約への漏れを防ぐ。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 契約区画ID（UUID）
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: ページ番号（1始まり）
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          description: 1ページあたりの件数（最大100）
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: entityType
          in: query
          required: false
          description: "エンティティ種別でフィルタ（例: ContractPlot, Customer, BuriedPerson, FamilyContact, PhysicalPlot）"
          schema:
            type: string
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      histories:
                        type: array
                        items:
                          $ref: "#/components/schemas/History"
                      pagination:
                        type: object
                        properties:
                          total:
                            type: integer
                          page:
                            type: integer
                          limit:
                            type: integer
                          totalPages:
                            type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/plots/{id}/terminate:
    post:
      tags:
        - Plots
      summary: 契約区画の解約（active → terminated）
      description: |
        active 状態の契約区画を terminated（解約）に遷移させる。
        論理削除（DELETE /plots/{id}）と異なり deleted_at は変更しないため、
        解約後も履歴・詳細・一覧から参照でき、誤操作時は /restore で復活できる。
        reason は履歴に記録するため必須（1〜200文字、空白のみは不可）。
        現在のステータスが active でない場合は 409 を返す。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 契約区画ID（UUID）
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: 解約理由（履歴に記録される）
                  example: 利用者からの解約申請のため
      responses:
        "200":
          description: 解約成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 契約区画を解約しました
                      id:
                        type: string
                        format: uuid
                      contractStatus:
                        type: string
                        enum: [vacant, active, terminated]
                        example: terminated
        "400":
          description: バリデーションエラー（reason 欠落 / 長すぎ等）
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: active 以外のステータスからの解約
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/plots/{id}/restore:
    post:
      tags:
        - Plots
      summary: 契約区画の復活（terminated → active）
      description: |
        terminated 状態の契約区画を active に戻す（誤操作リカバリ用）。
        reason は履歴に記録するため必須（1〜200文字、空白のみは不可）。
        現在のステータスが terminated でない場合は 409 を返す。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 契約区画ID（UUID）
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: 復活理由（履歴に記録される）
                  example: 担当者の入力ミスのため復活
      responses:
        "200":
          description: 復活成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 契約区画を復活しました
                      id:
                        type: string
                        format: uuid
                      contractStatus:
                        type: string
                        enum: [vacant, active, terminated]
                        example: active
        "400":
          description: バリデーションエラー（reason 欠落 / 長すぎ等）
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 現在のステータスが terminated でないため復活不可
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/plots/{id}/change-contractor:
    post:
      tags:
        - Plots
      summary: 名義変更（契約者roleの交代）
      description: |
        同一販売契約上で契約者（contractor role）を旧契約者から新契約者へ交代させる（#310）。
        契約・申込者（applicant role）・区画情報は不変のまま残り、
        変更は履歴に change_reason「名義変更」で記録される（過去の契約者を遡れる）。
        新契約者は既存顧客の指定（newCustomerId）か新規顧客の作成（newCustomer）の
        どちらか一方のみ指定可能。
        現在のステータスが active でない場合、または現在の契約者が存在しない場合は 409 を返す。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 契約区画ID（UUID）
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newCustomerId:
                  type: string
                  format: uuid
                  description: 新契約者にする既存顧客のID（newCustomer と排他）
                newCustomer:
                  type: object
                  description: 新契約者として新規作成する顧客情報（newCustomerId と排他）
                  required:
                    - name
                    - nameKana
                    - postalCode
                    - address
                  properties:
                    name:
                      type: string
                      maxLength: 100
                    nameKana:
                      type: string
                      maxLength: 100
                    postalCode:
                      type: string
                    address:
                      type: string
                      maxLength: 200
                    phoneNumber:
                      type: string
                      nullable: true
                changeDate:
                  type: string
                  format: date
                  nullable: true
                  description: 名義変更日（旧roleのrole_end_date / 新roleのrole_start_date。省略時は当日）
                reason:
                  type: string
                  maxLength: 200
                  description: 名義変更理由（任意。履歴の change_reason に「名義変更」へ付記）
      responses:
        "200":
          description: 名義変更成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 名義変更を実施しました
                      id:
                        type: string
                        format: uuid
                      oldContractor:
                        type: object
                        properties:
                          customerId:
                            type: string
                            format: uuid
                          name:
                            type: string
                      newContractor:
                        type: object
                        properties:
                          customerId:
                            type: string
                            format: uuid
                          name:
                            type: string
                          roleId:
                            type: string
                            format: uuid
                      changeDate:
                        type: string
                        format: date-time
        "400":
          description: バリデーションエラー（newCustomerId/newCustomer の排他違反、解約済み顧客の指定等）
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: active 以外のステータス / 現契約者不在 / 指定顧客が既に契約者
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

